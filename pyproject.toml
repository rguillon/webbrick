[project]
name = "webbrick"
version = "0.0.1"
description = "Python Web brick breaker"
authors = [{ name = "Renaud Guillon", email = "renaud.guillon@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://rguillon.github.io/webbrick/"
Repository = "https://github.com/rguillon/webbrick"
Documentation = "https://rguillon.github.io/webbrick/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "mutmut>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webbrick"]

[tool.ty.analysis]
allowed-unresolved-imports = ["js", "pyodide.**"]  # provided by Pyodide at runtime

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.deptry.per_rule_ignores]
DEP001 = ["js", "pyodide"]  # provided by Pyodide at runtime

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true


[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
ignore = [  "COM812",   # cause incompatibility with the formatter
            "ISC001",   # cause incompatibility with the formatter
            "D203",     # conflict with another rule
            "D213",     # conflict with another rule
            "D107",     # __init__ is documented by its class docstring
            ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101",     # Allow assert in tests
              "D100",     # No docstring in tests
              "D101",     # No docstring in tests
              "D102",     # No docstring in tests
              "D103",     # No docstring in tests
              "D105",     # No docstring in tests
              "D107",     # No docstring in tests
              "INP001",   # tests is not a package
              "N802",     # fakes mirror the JS camelCase API
              "N815",     # fakes mirror the JS camelCase API
              "PLR2004",  # magic values are fine in assertions
              "SLF001",   # tests drive the game's private steps
              "ARG001",   # fixture args may be unused in test helpers
              "S311",     # deterministic randomness in tests
              "PLC0415",  # imports inside fixtures need stubs first
              ]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = false
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["src/webbrick"]

[tool.mutmut]
source_paths = ["src/webbrick/"]
do_not_mutate = [  # drawing only: the tests check it runs, not what it paints
    "src/webbrick/graphics.py",
    "src/webbrick/sprite.py",
    "src/webbrick/particle.py",
    "src/webbrick/particles.py",
]
